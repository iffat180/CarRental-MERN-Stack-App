name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Run all tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Backend tests
      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Typecheck Backend (tsc)
        run: |
          cd server
          npm run typecheck

      - name: Build Backend (tsc)
        run: |
          cd server
          npm run build

      - name: Run Backend Unit Tests
        run: |
          cd server
          npm test

      - name: Run Backend Integration Tests (booking concurrency)
        run: |
          cd server
          npm run test:integration

      # Frontend
      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Lint Frontend (ESLint)
        run: |
          cd client
          npm run lint

      - name: Check Formatting (Prettier)
        run: |
          npm ci
          npm run format:check

      - name: Typecheck Frontend (tsc)
        run: |
          cd client
          npm run typecheck

      - name: Run Frontend Tests
        run: |
          cd client
          npm test

      - name: Build Frontend (tsc + vite)
        run: |
          cd client
          npm run build

      # End-to-end tests drive the built site in a real browser. The API is mocked
      # inside the tests, so no database or backend is needed.
      - name: Install Playwright browser
        run: |
          cd client
          npx playwright install --with-deps chromium

      - name: Run End-to-End Tests (Playwright)
        run: |
          cd client
          npm run e2e

      # Builds Storybook, then opens every story and checks it renders and has no
      # serious accessibility violations.
      - name: Check Storybook Stories (render + accessibility)
        run: |
          cd client
          npm run e2e:stories

      # Lighthouse on the production build (served with the real security headers and a mock
      # API): accessibility, SEO and best practices must stay above their limits.
      - name: Lighthouse (accessibility, SEO, best practices, performance)
        run: |
          cd client
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: client/.lighthouseci
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/playwright-report-stories
          retention-days: 7

      - name: All Tests Passed ✅
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All tests passed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Backend unit tests + booking-concurrency integration tests + frontend tests + end-to-end tests"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # Job 2: Verify AWS credentials (only after tests pass)
  verify-aws:
    name: Verify AWS Access
    runs-on: ubuntu-latest
    needs: test # Only run if tests pass

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS CLI Access
        run: |
          echo "Testing AWS S3 access..."
          aws s3 ls s3://${{ secrets.S3_BUCKET_NAME }} | head -5
          echo "✅ AWS credentials verified!"

  # Job 3: Summary
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test, verify-aws]

    steps:
      - name: Success Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 CI/CD Pipeline Completed Successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Tests: unit + integration + frontend passed"
          echo "✅ AWS Access: Verified"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
